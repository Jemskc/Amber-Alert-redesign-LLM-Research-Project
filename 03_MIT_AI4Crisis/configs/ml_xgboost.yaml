run_name: ml_xgboost
seed: 13
output_root: /Users/leobix/ai4crisis/outputs/triage_outputs

data:
  urgency_xlsx: /Users/leobix/ai4crisis/Final_Merged_All_Columns.xlsx
  category_xlsx: /Users/leobix/ai4crisis/Final_Merged_All_Columns.xlsx
  urgency_sheet: Sheet1
  category_sheet: Sheet1
  text_column: Post description
  urgency_columns:
    - Urg 1
    - Urg 2
    - Urg 3
    - Urg 4
    - Urg 5
    - Urg 6
    - Urg 7
    - Urg 8
  group_column: "#"
  aggregate_threads: true
  category_strategy: rn_only
  category_weights:
    rn: 2.0
    responder: 1.5
    crowd: 1.0
  merge:
    fuzzy: true
    fuzzy_threshold: 0.92

splits:
  test_size: 0.25
  val_size: 0.25
  group_column: group_id
  stratify_column: category_gold
  cv_folds: 5
  cv_group_column: group_id

openai:
  model: gpt-5-nano
  judge_model: gpt-5-nano
  embedding_model: text-embedding-3-large
  temperature: 0
  max_retries: 4
  cache_path: /Users/leobix/ai4crisis/artifacts/openai_cache.sqlite
  batch_size: 64
  dry_run: false
  save_embeddings: true
  embeddings_output_dir: artifacts/embeddings

ml:
  ordinal: false
  category_multilabel: true
  category_threshold: 0.5
  # XGBoost backend
  model_backend: xgboost
  model_params:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
  lgbm_log_period: 0  # Not used for XGBoost
  calibration:
    method: temperature
  sequential_option: feature_concat
  # Improvement options
  use_class_weights: true
  use_feature_scaling: true
  use_category_weights: true

pipelines:
  llm_joint: false
  llm_sequential: false
  oracle_llm: false
  ml_joint: true
  ml_joint_filtered: true
  ml_sequential: true
  ml_cv: false
  clustering: false
  elo_ranking: false
  policy: false
